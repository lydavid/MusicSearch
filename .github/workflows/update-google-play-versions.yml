name: Update Google Play version

on:
  push:
  workflow_dispatch:

jobs:
  update:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1
        with:
          token: ${{ secrets.PAT }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Get versions
        id: publish_play_store
        run: |
          bundle exec fastlane run google_play_track_release_names \
            track:beta \
            json_key:${{ steps.auth.outputs.credentials_file_path }}
          bundle exec fastlane run google_play_track_release_names \
            track:production \
            json_key:${{ steps.auth.outputs.credentials_file_path }}
